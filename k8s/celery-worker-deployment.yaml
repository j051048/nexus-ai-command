apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-celery-worker
  namespace: nexus-ai
  labels:
    app: nexus-celery-worker
    component: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nexus-celery-worker
  template:
    metadata:
      labels:
        app: nexus-celery-worker
        component: worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: celery-worker
          image: nexus-ai-command/backend:latest
          command:
            - celery
            - -A
            - app.core.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
          envFrom:
            - secretRef:
                name: nexus-backend-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.core.celery_app
                - inspect
                - ping
                - --timeout=10
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - celery
                - -A
                - app.core.celery_app
                - inspect
                - ping
                - --timeout=10
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
