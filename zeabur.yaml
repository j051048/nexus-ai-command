services:
  - name: nexus-backend
    type: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn nexus_backend.app.main:app --host 0.0.0.0 --port ${PORT:-8000}
    env:
      - REDIS_URL=${REDIS_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}

  - name: redis
    type: redis
    version: "7"
