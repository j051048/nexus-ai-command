<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brutalist Login - Frontend Design Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Crimson+Pro:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF3366;
            --secondary: #000000;
            --accent: #00FF88;
            --bg: #F5F5F0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Crimson Pro', serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 80%;
            height: 150%;
            background: linear-gradient(45deg, var(--primary) 0%, transparent 70%);
            opacity: 0.1;
            transform: rotate(-15deg);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: rotate(-15deg) translateY(0); }
            50% { transform: rotate(-15deg) translateY(-30px); }
        }

        .login-container {
            position: relative;
            max-width: 480px;
            width: 100%;
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: white;
            border: 4px solid var(--secondary);
            box-shadow: 12px 12px 0 var(--secondary);
            padding: 3rem;
            position: relative;
        }

        .card::after {
            content: '';
            position: absolute;
            top: -8px;
            right: -8px;
            width: 40px;
            height: 40px;
            background: var(--accent);
            border: 4px solid var(--secondary);
        }

        h1 {
            font-family: 'Space Mono', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 0.5rem;
            letter-spacing: -2px;
            animation: fadeIn 0.8s 0.2s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2rem;
            animation: fadeIn 0.8s 0.3s both;
        }

        .form-group {
            margin-bottom: 1.5rem;
            animation: fadeIn 0.8s 0.4s both;
        }

        label {
            display: block;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }

        input {
            width: 100%;
            padding: 1rem;
            border: 3px solid var(--secondary);
            background: var(--bg);
            font-family: 'Crimson Pro', serif;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        input:focus {
            outline: none;
            background: white;
            transform: translateX(4px) translateY(-4px);
            box-shadow: -4px 4px 0 var(--primary);
        }

        .btn {
            width: 100%;
            padding: 1.2rem;
            background: var(--primary);
            border: 3px solid var(--secondary);
            color: white;
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            animation: fadeIn 0.8s 0.5s both;
        }

        .btn:hover {
            transform: translate(4px, -4px);
            box-shadow: -4px 4px 0 var(--secondary);
        }

        .btn:active {
            transform: translate(2px, -2px);
            box-shadow: -2px 2px 0 var(--secondary);
        }

        .footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
            animation: fadeIn 0.8s 0.6s both;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: border-color 0.3s;
        }

        .footer a:hover {
            border-bottom-color: var(--primary);
        }

        @media (max-width: 640px) {
            .card {
                padding: 2rem;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card">
            <h1>NEXUS</h1>
            <p class="subtitle">AI驱动的销售管理系统</p>

            <form>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn">登录</button>
            </form>

            <div class="footer">
                还没有账号? <a href="#">立即注册</a>
            </div>
        </div>
    </div>
</body>
</html>
