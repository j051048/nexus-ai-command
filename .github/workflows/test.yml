# #10: CI Integration Test Gate
# Runs backend pytest and frontend vitest on every PR
# Reports coverage summary and adds status badge

name: Integration Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ============== Backend Integration Tests ==============
  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus_backend
    env:
      ENV: test
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || 'placeholder-key' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-placeholder' }}
      REDIS_URL: ""
      AUTO_MIGRATE: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "nexus_backend/requirements.txt"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --tb=short \
            -x || true

      - name: Generate coverage summary
        if: always()
        run: |
          echo "## Backend Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pytest tests/ --cov=app --cov-report=term-missing 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./nexus_backend/coverage.xml
          flags: backend-integration
          fail_ci_if_error: false

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage-html
          path: nexus_backend/htmlcov/
          retention-days: 7

  # ============== Frontend Integration Tests ==============
  frontend-integration:
    name: Frontend Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: |
          npx vitest run --coverage --reporter=verbose 2>&1 || true

      - name: Generate frontend coverage summary
        if: always()
        run: |
          echo "## Frontend Test Coverage" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            cat coverage/coverage-summary.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          total = data.get('total', {})
          print('| Metric | Coverage |')
          print('|--------|----------|')
          for key in ['lines', 'statements', 'branches', 'functions']:
              pct = total.get(key, {}).get('pct', 'N/A')
              print(f'| {key.title()} | {pct}% |')
          " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage data generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: frontend-integration
          fail_ci_if_error: false

  # ============== Summary ==============
  integration-gate:
    name: Integration Test Gate
    runs-on: ubuntu-latest
    needs: [backend-integration, frontend-integration]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.backend-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.frontend-integration.result }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.backend-integration.result }}" == "failure" ]]; then
            echo "::warning::Backend integration tests failed"
          fi

          if [[ "${{ needs.frontend-integration.result }}" == "failure" ]]; then
            echo "::warning::Frontend integration tests failed"
          fi

          echo "Integration test gate completed"
