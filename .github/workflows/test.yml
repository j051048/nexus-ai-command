# #10: CI Integration Test Gate
# Frontend integration tests with coverage reporting.
# NOTE: ci.yml already runs vitest + Playwright on push/PR to main/develop.
# This workflow only triggers on manual dispatch to avoid duplicate runs.

name: Integration Tests

on:
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # Backend tests are handled by ci.yml (backend-test job)
  # This workflow focuses on frontend integration tests only

  # ============== Frontend Integration Tests ==============
  frontend-integration:
    name: Frontend Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: |
          npx vitest run --coverage --reporter=verbose

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E Tests
        run: |
          # 启动前端开发服务器并等待，然后运行测试
          # 注意：生产环境应先 npm run build 然后使用 preview 模式，但目前为了测试稳定性直接使用 dev
          npm run dev -- --port 5173 &
          npx wait-on http://localhost:5173
          npx playwright test

      - name: Generate frontend coverage summary
        if: always()
        run: |
          echo "## Frontend Test Coverage" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            cat coverage/coverage-summary.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          total = data.get('total', {})
          print('| Metric | Coverage |')
          print('|--------|----------|')
          for key in ['lines', 'statements', 'branches', 'functions']:
              pct = total.get(key, {}).get('pct', 'N/A')
              print(f'| {key.title()} | {pct}% |')
          " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage data generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: frontend-integration
          fail_ci_if_error: false

  # ============== Summary ==============
  integration-gate:
    name: Integration Test Gate
    runs-on: ubuntu-latest
    needs: [frontend-integration]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.frontend-integration.result }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.frontend-integration.result }}" == "failure" ]]; then
            echo "::error::Frontend integration tests failed"
            exit 1
          fi

          echo "Integration test gate passed"
