# Item 52: Preview Environment for Pull Requests
name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  NODE_VERSION: "20"

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend with PR-specific env vars
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-key' }}
          VITE_APP_ENV: preview
          VITE_PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Deploy to Vercel preview
        id: vercel-deploy
        if: env.VERCEL_TOKEN != ''
        run: |
          DEPLOYMENT_URL=$(npx vercel --token=${{ secrets.VERCEL_TOKEN }} --yes 2>&1 | tail -1)
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $DEPLOYMENT_URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment PR with preview URL
        if: steps.vercel-deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = '${{ steps.vercel-deploy.outputs.url }}';
            const prNumber = context.payload.pull_request.number;
            const marker = '<!-- preview-comment -->';

            // Find existing preview comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body.includes(marker));

            const body = [
              marker,
              `## Preview Environment`,
              ``,
              `| Item | Detail |`,
              `|------|--------|`,
              `| Preview URL | ${previewUrl} |`,
              `| Commit | \`${context.sha.substring(0, 7)}\` |`,
              `| Branch | \`${context.payload.pull_request.head.ref}\` |`,
              `| Updated | ${new Date().toISOString()} |`,
              ``,
              `> This preview will be automatically cleaned up when the PR is closed.`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup-preview:
    name: Cleanup Preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - name: Remove Vercel preview deployment
        if: env.VERCEL_TOKEN != ''
        run: |
          echo "Cleaning up preview for PR #${{ github.event.pull_request.number }}"
          # List and remove deployments matching this PR branch
          npx vercel ls --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null | \
            grep "${{ github.event.pull_request.head.ref }}" | \
            awk '{print $2}' | \
            xargs -I {} npx vercel rm {} --token=${{ secrets.VERCEL_TOKEN }} --yes 2>/dev/null || true
          echo "Preview cleanup completed"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment PR cleanup notice
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const marker = '<!-- preview-comment -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n## Preview Environment\n\nPreview has been cleaned up (PR closed).`,
              });
            }
