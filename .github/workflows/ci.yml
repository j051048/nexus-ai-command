# P1 Optimization: CI/CD Pipeline
# Automated testing, linting, and security scanning

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ============== Frontend Jobs ==============
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test -- --coverage

      - name: Check frontend coverage
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            TOTAL=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.lines.pct)")
            echo "## Frontend Test Coverage: ${TOTAL}%" >> $GITHUB_STEP_SUMMARY
            if (( $(echo "$TOTAL < 50" | bc -l) )); then
              echo "::warning::Frontend test coverage is ${TOTAL}%, below 50% threshold."
            fi
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test, frontend-typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-key' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

  # ============== Backend Jobs ==============
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus_backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "nexus_backend/requirements.txt"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff 'black==24.10.0' isort
          pip install -r requirements-dev.txt

      - name: Run Ruff (linter)
        run: ruff check app/ --output-format=github

      - name: Check formatting with Black
        run: black --check app/

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus_backend
    env:
      ENV: test
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || 'placeholder-key' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-placeholder' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "nexus_backend/requirements-dev.txt"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-report=json --retries 2 --retry-delay 1

      - name: Check coverage threshold
        if: always()
        run: |
          if [ -f coverage.json ]; then
            TOTAL=$(python3 -c "import json; data=json.load(open('coverage.json')); print(round(data['totals']['percent_covered'], 1))")
            echo "## Backend Test Coverage: ${TOTAL}%" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Blocking threshold at 30%
            if (( $(echo "$TOTAL < 30" | bc -l) )); then
              echo "::error::Backend test coverage is ${TOTAL}%, below 30% threshold."
              echo "Coverage is below 30% target. Please improve test coverage." >> $GITHUB_STEP_SUMMARY
              exit 1
            else
              echo "Coverage meets the 30% minimum threshold." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "::warning::Coverage report not generated"
          fi

      - name: Generate coverage badge
        if: always() && github.ref == 'refs/heads/main'
        run: |
          if [ -f coverage.json ]; then
            TOTAL=$(python3 -c "import json; data=json.load(open('coverage.json')); print(int(data['totals']['percent_covered']))")
            if [ "$TOTAL" -ge 80 ]; then COLOR="brightgreen";
            elif [ "$TOTAL" -ge 60 ]; then COLOR="green";
            elif [ "$TOTAL" -ge 50 ]; then COLOR="yellow";
            else COLOR="red"; fi
            echo "Coverage: ${TOTAL}% (${COLOR})"
            echo "COVERAGE_PCT=${TOTAL}" >> $GITHUB_ENV
            echo "COVERAGE_COLOR=${COLOR}" >> $GITHUB_ENV
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./nexus_backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ============== Security Scanning ==============
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"

  # ============== #40: Dependency Security Scanning ==============
  dependency-security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "nexus_backend/requirements.txt"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pip-audit
          pip install -r nexus_backend/requirements.txt

      - name: Run pip-audit (Python dependency scan)
        continue-on-error: true
        run: |
          echo "## Python Dependency Audit" >> $GITHUB_STEP_SUMMARY
          pip-audit --format=markdown --desc >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo "" >> $GITHUB_STEP_SUMMARY
          pip-audit || true

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run npm audit (Node dependency scan)
        continue-on-error: true
        run: |
          echo "## Node.js Dependency Audit" >> $GITHUB_STEP_SUMMARY
          npm audit --production 2>&1 | head -100 >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          npm audit --production || true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ============== E2E Smoke Tests (PRs) ==============
  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [frontend-build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Run E2E smoke tests (critical path only)
        run: npx playwright test --project=chromium --grep="@smoke|@critical" --timeout=30000
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-key' }}
          E2E_MODE: smoke

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 3

  # ============== E2E Full Tests (main push) ==============
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Run full E2E tests
        run: npx playwright test --project=chromium
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ============== Summary Job ==============
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-test, security-scan, dependency-security]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "Backend Test: ${{ needs.backend-test.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo "Dependency Security: ${{ needs.dependency-security.result }}"

          if [[ "${{ needs.frontend-build.result }}" == "failure" ]]; then
            echo "::error::Frontend build failed"
            exit 1
          fi

          if [[ "${{ needs.backend-test.result }}" == "failure" ]]; then
            echo "::error::Backend tests failed"
            exit 1
          fi

          if [[ "${{ needs.security-scan.result }}" == "failure" ]]; then
            echo "::error::Security scan failed"
            exit 1
          fi

          if [[ "${{ needs.dependency-security.result }}" == "failure" ]]; then
            echo "::error::Dependency security check failed"
            exit 1
          fi

          echo "CI Pipeline completed successfully"

  # ============== Deployment (#46 CD Pipeline) ==============
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ci-success]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Deploy frontend to Vercel
        if: env.VERCEL_TOKEN != ''
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Trigger backend deployment
        if: env.DEPLOY_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"ref": "${{ github.sha }}", "environment": "production"}'
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}

      - name: Deployment summary
        run: |
          echo "🚀 Deployment triggered for commit ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"

  # ============== Staging Deployment ==============
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [ci-success]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for staging
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy frontend to Vercel (staging)
        if: env.VERCEL_TOKEN != ''
        run: npx vercel --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build and push backend Docker image (staging)
        run: |
          if [ -n "$DOCKER_REGISTRY" ]; then
            echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
            docker build -t nexus-backend:staging-${{ github.sha }} ./nexus_backend
            docker tag nexus-backend:staging-${{ github.sha }} $DOCKER_REGISTRY/nexus-backend:staging-latest
            docker push $DOCKER_REGISTRY/nexus-backend:staging-latest
          else
            echo "DOCKER_REGISTRY not configured, skipping Docker build"
          fi
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Trigger backend staging deployment
        if: env.STAGING_DEPLOY_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"ref": "${{ github.sha }}", "environment": "staging"}'
        env:
          STAGING_DEPLOY_WEBHOOK_URL: ${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}

      - name: Run staging smoke tests
        if: env.STAGING_API_URL != ''
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
        run: |
          echo "Running smoke tests against staging environment..."
          STAGING_URL="${{ secrets.STAGING_API_URL }}"

          # Wait for deployment to propagate (max 60s)
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              break
            fi
            echo "Waiting for staging (attempt $i, status=$STATUS)..."
            sleep 10
          done

          # Verify health endpoint
          echo "Checking /health..."
          curl -sf "${STAGING_URL}/health" || { echo "::error::Staging /health failed"; exit 1; }

          # Verify API docs reachable
          echo "Checking /docs..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}/docs")
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Staging /docs returned $STATUS"
          fi

          echo "Staging smoke tests passed"

      - name: Staging deployment summary
        run: |
          echo "🚀 Staging deployment triggered for commit ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Environment: staging"
