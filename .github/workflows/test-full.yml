# Full Test Suite — 9 大类全量回归
#
# 触发：手动 dispatch 或 nightly cron
# 覆盖：单元 / 集成 / 安全 / 性能 / E2E 全链路
#
# 质量门禁：
#   - 前端/后端覆盖率不低于当前基线，并可逐步上调
#   - 安全测试 0 CRITICAL
#   - E2E 关键路径 100% 通过

name: Full Test Suite

on:
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: "Skip E2E tests (faster)"
        type: boolean
        default: false
  schedule:
    # 每天凌晨 3:17 UTC (北京 11:17) 运行
    - cron: "17 3 * * *"

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  FRONTEND_COVERAGE_MIN: "7"
  BACKEND_COVERAGE_MIN: "30"

jobs:
  frontend-static:
    name: "0A. Frontend Static Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint code
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_BUILD_PROFILE: ci
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "placeholder-key"
      - name: Bundle budget
        run: npm run check:bundle
      - name: Text quality
        run: npm run check:text

  backend-static:
    name: "0B. Backend Static Gate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus_backend
    env:
      ENV: test
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_KEY: "placeholder-key"
      OPENAI_API_KEY: "sk-placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: nexus_backend/requirements-dev.txt
      - run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app/ --output-format=github
      - name: Black
        run: black --check app/
      - name: Mypy focused backend type check
        run: |
          mypy \
            app/core/config.py \
            app/core/rate_limiter.py \
            app/core/token_budget.py \
            app/services/agent_eval_baseline_service.py \
            app/services/agent_ops_runtime_service.py \
            --ignore-missing-imports \
            --no-strict-optional \
            --follow-imports=skip \
            --show-error-codes
      - name: QA last-mile contracts
        working-directory: ${{ github.workspace }}
        env:
          RUN_REAL_STAGING_GOLDEN_PATHS: "0"
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_TEST_TOKEN: ${{ secrets.STAGING_TEST_TOKEN }}
          STAGING_ORG_ID: ${{ secrets.STAGING_ORG_ID }}
        run: python scripts/qa_last_mile_gate.py

  supply-chain-security:
    name: "0C. Supply Chain and Secret Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: nexus_backend/requirements.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Python dependency audit
        run: |
          pip install --upgrade pip pip-audit
          pip-audit -r nexus_backend/requirements.txt --strict || true
      - name: npm critical dependency audit
        run: npm audit --omit=dev --audit-level=critical
      - name: Hardcoded secret pattern scan
        run: python scripts/scan_hardcoded_secrets.py
      - name: Security severity policy gate
        run: python scripts/security_severity_gate.py
      - name: Trivy critical filesystem gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  openapi-contract:
    name: "0D. OpenAPI Contract"
    runs-on: ubuntu-latest
    env:
      ENV: test
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_KEY: "placeholder-key"
      OPENAI_API_KEY: "sk-placeholder"
      PYTHONPATH: ${{ github.workspace }}/nexus_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: nexus_backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: ./nexus_backend
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Validate OpenAPI contract
        run: python scripts/check_openapi_contract.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openapi-contract
          path: openapi-contract.generated.json
          retention-days: 7

  backend-docker-smoke:
    name: "0E. Backend Docker Build Smoke"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t nexus-backend-smoke:${{ github.sha }} .
      - name: Run /health/live smoke
        run: |
          docker run -d --rm \
            --name nexus-backend-smoke \
            -p 8000:8000 \
            -e ENV=test \
            -e SUPABASE_URL=https://placeholder.supabase.co \
            -e SUPABASE_SERVICE_KEY=placeholder-key \
            -e SUPABASE_JWT_SECRET=test-secret-key-for-smoke-only \
            -e LANGGRAPH_CHECKPOINTER=memory \
            -e ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= \
            -e HEALTH_CHECK_TOKEN=smoke-health-token-at-least-24-chars \
            -e OPENAI_API_KEY=sk-placeholder \
            nexus-backend-smoke:${{ github.sha }}
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health/live; then
              docker stop nexus-backend-smoke
              exit 0
            fi
            sleep 2
          done
          docker logs nexus-backend-smoke
          docker stop nexus-backend-smoke
          exit 1
  # ═══════════════════════════════════════════════════════════════
  # 1. 前端单元测试 + 覆盖率
  # ═══════════════════════════════════════════════════════════════
  frontend-unit:
    name: "1. Frontend Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run vitest (unit + hooks + components + security + utils + contexts)
        run: |
          npx vitest run --coverage --reporter=verbose \
            src/__tests__/lib \
            src/__tests__/hooks \
            src/__tests__/components \
            src/__tests__/security \
            src/__tests__/utils \
            src/__tests__/contexts

      - name: Extract coverage
        id: cov
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            PCT=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.lines.pct)")
            echo "pct=$PCT" >> $GITHUB_OUTPUT
            echo "## Frontend Coverage: ${PCT}%" >> $GITHUB_STEP_SUMMARY
          else
            echo "pct=0" >> $GITHUB_OUTPUT
            echo "## Frontend Coverage: N/A" >> $GITHUB_STEP_SUMMARY
          fi

      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: frontend-unit
          fail_ci_if_error: false

    outputs:
      coverage: ${{ steps.cov.outputs.pct }}

  # ═══════════════════════════════════════════════════════════════
  # 2. 前端 React Flow 设计器专项
  # ═══════════════════════════════════════════════════════════════
  frontend-workflow:
    name: "2. Workflow Designer Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run workflow designer tests
        run: npx vitest run --reporter=verbose src/__tests__/features

  # ═══════════════════════════════════════════════════════════════
  # 3. 后端单元测试 + 覆盖率
  # ═══════════════════════════════════════════════════════════════
  backend-unit:
    name: "3. Backend Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus_backend
    env:
      ENV: test
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_KEY: "placeholder-key"
      OPENAI_API_KEY: "sk-placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: nexus_backend/requirements-dev.txt

      - run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v \
            --cov=app --cov-report=xml --cov-report=term-missing \
            --retries 2 --retry-delay 1

      - name: Extract coverage
        id: cov
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            PCT=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          rate = float(root.attrib.get('line-rate', 0))
          print(round(rate * 100, 1))
          ")
            echo "pct=$PCT" >> $GITHUB_OUTPUT
            echo "## Backend Unit Coverage: ${PCT}%" >> $GITHUB_STEP_SUMMARY
          else
            echo "pct=0" >> $GITHUB_OUTPUT
          fi

      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./nexus_backend/coverage.xml
          flags: backend-unit
          fail_ci_if_error: false

    outputs:
      coverage: ${{ steps.cov.outputs.pct }}

  # ═══════════════════════════════════════════════════════════════
  # 4. 后端集成测试
  # ═══════════════════════════════════════════════════════════════
  backend-integration:
    name: "4. Backend Integration Tests"
    runs-on: ubuntu-latest
    needs: [backend-unit]
    defaults:
      run:
        working-directory: ./nexus_backend
    env:
      ENV: test
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_KEY: "placeholder-key"
      OPENAI_API_KEY: "sk-placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: nexus_backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Run integration tests
        run: pytest tests/integration/ -v --retries 2 --retry-delay 1

  # ═══════════════════════════════════════════════════════════════
  # 5. AI Agent 中控矩阵 + Plan/Execute/Reflect
  # ═══════════════════════════════════════════════════════════════
  backend-agent:
    name: "5. AI Agent Matrix Tests"
    runs-on: ubuntu-latest
    needs: [backend-unit]
    defaults:
      run:
        working-directory: ./nexus_backend
    env:
      ENV: test
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_KEY: "placeholder-key"
      OPENAI_API_KEY: "sk-placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: nexus_backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Run agent tests (intent matrix + plan/execute/reflect)
        run: pytest tests/agent/ -v --retries 2 --retry-delay 1

  # ═══════════════════════════════════════════════════════════════
  # 6. 安全测试（Prompt 注入 + XSS/CSRF + 权限矩阵）
  # ═══════════════════════════════════════════════════════════════
  backend-security:
    name: "6. Security Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus_backend
    env:
      ENV: test
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_KEY: "placeholder-key"
      OPENAI_API_KEY: "sk-placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: nexus_backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Run security tests
        run: pytest tests/security/ -v --retries 2 --retry-delay 1

  # ═══════════════════════════════════════════════════════════════
  # 7. 性能 / 负载测试
  # ═══════════════════════════════════════════════════════════════
  backend-performance:
    name: "7. Performance Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus_backend
    env:
      ENV: test
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_KEY: "placeholder-key"
      OPENAI_API_KEY: "sk-placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: nexus_backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Run performance tests
        run: pytest tests/performance/ -v --retries 2 --retry-delay 1

  # ═══════════════════════════════════════════════════════════════
  # 8. 后端 E2E 业务闭环
  # ═══════════════════════════════════════════════════════════════
  backend-e2e:
    name: "8. Backend E2E Tests"
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-security]
    if: ${{ !inputs.skip_e2e }}
    defaults:
      run:
        working-directory: ./nexus_backend
    env:
      ENV: test
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_KEY: "placeholder-key"
      OPENAI_API_KEY: "sk-placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: nexus_backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Run E2E tests
        run: pytest tests/e2e/ -v --retries 2 --retry-delay 1

  # ═══════════════════════════════════════════════════════════════
  # 9. Playwright E2E 业务流程
  # ═══════════════════════════════════════════════════════════════
  playwright-e2e:
    name: "9. Playwright E2E Flows"
    runs-on: ubuntu-latest
    needs: [frontend-unit]
    if: ${{ !inputs.skip_e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_BUILD_PROFILE: ci
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "placeholder-key"

      - name: Run Playwright E2E
        run: npx playwright test --project=chromium
        env:
          E2E_MODE: full
      - name: Run visual regression snapshots
        if: ${{ vars.RUN_VISUAL_REGRESSION == 'true' }}
        run: npx playwright test e2e/visual-regression.spec.ts --project=chromium
        env:
          RUN_VISUAL_REGRESSION: "1"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # Quality Gate — 质量门禁
  # ═══════════════════════════════════════════════════════════════
  frontend-accessibility:
    name: "10. Accessibility Smoke"
    runs-on: ubuntu-latest
    needs: [frontend-static]
    if: ${{ !inputs.skip_e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_BUILD_PROFILE: ci
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "placeholder-key"
      - name: Run accessibility smoke
        run: npx playwright test e2e/accessibility-smoke.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-accessibility-report
          path: playwright-report/
          retention-days: 7

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - frontend-static
      - backend-static
      - supply-chain-security
      - openapi-contract
      - backend-docker-smoke
      - frontend-unit
      - frontend-workflow
      - backend-unit
      - backend-integration
      - backend-agent
      - backend-security
      - backend-performance
      - backend-e2e
      - playwright-e2e
      - frontend-accessibility
    if: always()
    steps:
      - name: Evaluate quality gates
        run: |
          echo "# Full Test Suite — Quality Gate Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # ── 结果汇总表 ──
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| # | Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 0A | Frontend Static Gate | ${{ needs.frontend-static.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 0B | Backend Static Gate | ${{ needs.backend-static.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 0C | Supply Chain and Secret Scan | ${{ needs.supply-chain-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 0D | OpenAPI Contract | ${{ needs.openapi-contract.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 0E | Backend Docker Build Smoke | ${{ needs.backend-docker-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Frontend Unit | ${{ needs.frontend-unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | Workflow Designer | ${{ needs.frontend-workflow.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 | Backend Unit | ${{ needs.backend-unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | Backend Integration | ${{ needs.backend-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 | AI Agent Matrix | ${{ needs.backend-agent.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 6 | Security | ${{ needs.backend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 7 | Performance | ${{ needs.backend-performance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 8 | Backend E2E | ${{ needs.backend-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 9 | Playwright E2E | ${{ needs.playwright-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 10 | Accessibility Smoke | ${{ needs.frontend-accessibility.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FAILED=0

          # ── 覆盖率门禁 ──
          echo "## Coverage" >> $GITHUB_STEP_SUMMARY
          FE_COV="${{ needs.frontend-unit.outputs.coverage }}"
          BE_COV="${{ needs.backend-unit.outputs.coverage }}"
          FE_MIN="${FRONTEND_COVERAGE_MIN:-7}"
          BE_MIN="${BACKEND_COVERAGE_MIN:-30}"
          echo "| Layer | Coverage | Threshold | Pass |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|----------|-----------|------|" >> $GITHUB_STEP_SUMMARY

          FE_PASS="N/A"
          if [ -n "$FE_COV" ] && [ "$FE_COV" != "0" ]; then
            if awk "BEGIN {exit !($FE_COV >= $FE_MIN)}"; then
              FE_PASS="Yes"
            else
              FE_PASS="No"
              echo "::error::GATE FAILED: Frontend coverage ${FE_COV}% is below ${FE_MIN}%"
              FAILED=1
            fi
          else
            echo "::error::GATE FAILED: Frontend coverage is missing"
            FAILED=1
          fi
          echo "| Frontend | ${FE_COV:-N/A}% | ${FE_MIN}% | $FE_PASS |" >> $GITHUB_STEP_SUMMARY

          BE_PASS="N/A"
          if [ -n "$BE_COV" ] && [ "$BE_COV" != "0" ]; then
            if awk "BEGIN {exit !($BE_COV >= $BE_MIN)}"; then
              BE_PASS="Yes"
            else
              BE_PASS="No"
              echo "::error::GATE FAILED: Backend coverage ${BE_COV}% is below ${BE_MIN}%"
              FAILED=1
            fi
          else
            echo "::error::GATE FAILED: Backend coverage is missing"
            FAILED=1
          fi
          echo "| Backend | ${BE_COV:-N/A}% | ${BE_MIN}% | $BE_PASS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # ── 硬性门禁 ──
          SKIP_E2E="${{ inputs.skip_e2e }}"

          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::GATE FAILED: ${name} result is ${result}"
              FAILED=1
            fi
          }

          require_e2e_success_or_manual_skip() {
            local name="$1"
            local result="$2"
            if [[ "$SKIP_E2E" == "true" && "$result" == "skipped" ]]; then
              echo "::notice::GATE ALLOWED: ${name} skipped by workflow_dispatch input"
              return
            fi
            require_success "$name" "$result"
          }

          require_success "Frontend static gate" "${{ needs.frontend-static.result }}"
          require_success "Backend static gate" "${{ needs.backend-static.result }}"
          require_success "Supply chain and secret scan" "${{ needs.supply-chain-security.result }}"
          require_success "OpenAPI contract" "${{ needs.openapi-contract.result }}"
          require_success "Backend Docker build smoke" "${{ needs.backend-docker-smoke.result }}"
          require_success "Frontend unit tests" "${{ needs.frontend-unit.result }}"
          require_success "Workflow designer tests" "${{ needs.frontend-workflow.result }}"
          require_success "Backend unit tests" "${{ needs.backend-unit.result }}"
          require_success "Backend integration tests" "${{ needs.backend-integration.result }}"
          require_success "AI Agent matrix tests" "${{ needs.backend-agent.result }}"
          require_success "Security tests" "${{ needs.backend-security.result }}"
          require_success "Performance tests" "${{ needs.backend-performance.result }}"
          require_e2e_success_or_manual_skip "Backend E2E tests" "${{ needs.backend-e2e.result }}"
          require_e2e_success_or_manual_skip "Playwright E2E tests" "${{ needs.playwright-e2e.result }}"
          require_e2e_success_or_manual_skip "Accessibility smoke" "${{ needs.frontend-accessibility.result }}"

          # 安全测试必须通过
          if [[ "${{ needs.backend-security.result }}" == "failure" ]]; then
            echo "::error::GATE FAILED: Security tests failed"
            FAILED=1
          fi

          # 后端单元测试必须通过
          if [[ "${{ needs.backend-unit.result }}" == "failure" ]]; then
            echo "::error::GATE FAILED: Backend unit tests failed"
            FAILED=1
          fi

          # 前端单元测试必须通过
          if [[ "${{ needs.frontend-unit.result }}" == "failure" ]]; then
            echo "::error::GATE FAILED: Frontend unit tests failed"
            FAILED=1
          fi

          # Agent 矩阵测试必须通过
          if [[ "${{ needs.backend-agent.result }}" == "failure" ]]; then
            echo "::error::GATE FAILED: AI Agent matrix tests failed"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## QUALITY GATE: FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## QUALITY GATE: PASSED" >> $GITHUB_STEP_SUMMARY
