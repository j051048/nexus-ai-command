name: Nightly Agent Quality

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      require_live:
        description: "Fail unless all live replay credentials are configured"
        required: false
        default: false
        type: boolean
      strict_visual:
        description: "Fail on visual diffs instead of generating missing Linux baselines"
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  replay-and-release-evidence:
    name: Agent Replay and Release Evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run replay harness
        run: |
          if [[ -n "$AGENT_REPLAY_BASE_URL" && -n "$AGENT_REPLAY_TOKEN" ]]; then
            python scripts/agent_replay_nightly.py --require-live
          elif [[ "$REQUIRE_LIVE" == "true" ]]; then
            echo "::error::Live Agent replay was required, but AGENT_REPLAY_BASE_URL or AGENT_REPLAY_TOKEN is missing"
            exit 1
          else
            echo "::warning::Live Agent replay credentials are not configured; running static replay contracts"
            python scripts/agent_replay_nightly.py
          fi
        env:
          AGENT_REPLAY_BASE_URL: ${{ secrets.AGENT_REPLAY_BASE_URL }}
          AGENT_REPLAY_TOKEN: ${{ secrets.AGENT_REPLAY_TOKEN }}
          REQUIRE_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live || false }}

      - name: Run live customer delivery acceptance
        run: |
          if [[ -n "$GOLDEN_ACCEPTANCE_BASE_URL" && -n "$GOLDEN_ACCEPTANCE_TOKEN" && -n "$GOLDEN_ACCEPTANCE_ORG_ID" ]]; then
            python -m pip install "httpx==0.28.1" "python-docx==1.1.2" "pypdf==6.16.1"
            python scripts/run_customer_golden_acceptance.py --require-live --output dist/customer-golden-acceptance.json
          elif [[ "$REQUIRE_LIVE" == "true" ]]; then
            echo "::error::Live customer acceptance was required, but one or more GOLDEN_ACCEPTANCE credentials are missing"
            exit 1
          else
            echo "::warning::Live customer acceptance credentials are not configured; running static acceptance contracts"
            python scripts/run_customer_golden_acceptance.py
          fi
        env:
          GOLDEN_ACCEPTANCE_BASE_URL: ${{ secrets.GOLDEN_ACCEPTANCE_BASE_URL }}
          GOLDEN_ACCEPTANCE_TOKEN: ${{ secrets.GOLDEN_ACCEPTANCE_TOKEN }}
          GOLDEN_ACCEPTANCE_ORG_ID: ${{ secrets.GOLDEN_ACCEPTANCE_ORG_ID }}
          REQUIRE_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live || false }}

      - name: Static release gates
        run: |
          python scripts/customer_acceptance_gate.py
          python scripts/release_quality_gate.py
          python scripts/collect_release_evidence.py
          python scripts/collect_soc2_evidence.py

      - name: Upload nightly evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-agent-quality-evidence
          path: |
            dist/release-evidence.json
            dist/soc2-evidence.json
            dist/customer-golden-acceptance.json
          retention-days: 30

  visual-regression-baselines:
    name: Visual Regression (Linux baselines)
    runs-on: ubuntu-latest
    needs: [replay-and-release-evidence]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_BUILD_PROFILE: ci
          VITE_API_BASE_URL: ${{ secrets.STAGING_API_URL || 'https://placeholder.invalid' }}
          VITE_APP_ENV: preview
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || 'placeholder-key' }}

      # Committed snapshots are Windows-generated (`*-win32.png`) and only usable
      # on a developer workstation. CI runs on Linux, so it either generates the
      # missing Linux baselines as evidence for a maintainer to commit, or (when
      # strict_visual is set) compares against already-committed Linux baselines.
      - name: Run visual regression suite
        run: |
          if [[ "${{ inputs.strict_visual }}" == "true" ]]; then
            npx playwright test e2e/visual-regression.spec.ts --project=chromium
          else
            npx playwright test e2e/visual-regression.spec.ts --project=chromium --update-snapshots=missing
          fi
        env:
          RUN_VISUAL_REGRESSION: "1"

      - name: Upload generated baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-snapshots-linux
          path: e2e/visual-regression.spec.ts-snapshots/
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: playwright-report/
          retention-days: 7
