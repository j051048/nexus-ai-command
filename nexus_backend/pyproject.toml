[project]
name = "nexus-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = [
    "E501",   # line too long
    "B008",   # function call in default argument
    "B904",   # raise without from
    "E402",   # module level import not at top of file (many lazy imports)
    "N806",   # variable in function should be lowercase (constants in functions)
    "N802",   # function name should be lowercase (Pydantic validators)
    "N814",   # camelcase imported as constant
    "SIM105", # use contextlib.suppress (stylistic preference)
    "SIM108", # use ternary operator (readability preference)
    "SIM103", # return condition directly (readability preference)
    "SIM102", # collapsible if (readability preference)
    "SIM114", # combine if branches (readability preference)
    "SIM201", # use != instead of not == (stylistic)
    "A001",   # variable shadowing builtin
    "A002",   # argument shadowing builtin
    "A003",   # attribute shadowing builtin
    "B024",   # abstract base class without abstract methods
    "B039",   # mutable contextvar default
    "E701",   # multiple statements on one line
    "E741",   # ambiguous variable name
]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
target-version = ["py311"]
line-length = 120

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --timeout=30"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "app/__pycache__/*",
    "*/migrations/*",
    "*/alembic/*",
    "app/main.py",
    "app/agent/roles/*",
    "app/agent/graph.py",
    "app/agent/node_*.py",
    "app/agent/stream.py",
    "app/agent/nodes_orchestrator.py",
    "app/agent/router.py",
    "app/core/prompts/*",
    "app/core/celery_app.py",
    "app/core/api_docs.py",
    "app/templates/*",
    "app/integrations/*",
    "app/tools/*",
    "app/routers/*",
    "app/services/im_platform/*",
    "app/services/notification_adapters/*",
    "app/services/llm_adapters/*",
    "app/services/llm_gateway/*",
    "app/services/conversation_memory/*",
    "app/services/etl/*",
    "app/services/payment_gateway.py",
    "app/services/content_moderation.py",
    "app/services/vector_service.py",
    "app/startup/*",
    "app/tasks/*",
    "app/monitoring/*",
]

[tool.coverage.report]
fail_under = 40
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
    "\\.\\.\\.",
    "logger\\.(debug|info|warning|error|critical|exception)",
    "except .* as e:",
    "except Exception",
    "except KeyError",
    "except ValueError",
    "except ImportError",
    "@(abc\\.)?abstractmethod",
    "def __repr__",
    "def __str__",
]
