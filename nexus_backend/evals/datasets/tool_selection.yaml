  - id: ts_041
    description: "模糊意图：那个客户怎么样了 → 应追问"
    user_message: "那个客户怎么样了"
    expected_tools: ["ask_user"]
    context: {}

  - id: ts_042
    description: "模糊意图：帮我查一下 → 应追问"
    user_message: "帮我查一下"
    expected_tools: ["ask_user"]
    context: {}

  # ── 易混淆工具区分 ──
  - id: ts_043
    description: "个人考勤用 query_attendance 而非 get_attendance_record"
