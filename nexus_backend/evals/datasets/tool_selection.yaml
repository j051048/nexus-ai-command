    context: {}

  # ── 跨域多步骤 ──
  - id: ts_037
    description: "跨域：考勤+绩效查询"
    user_message: "看看小王最近的考勤和业绩怎么样"
    expected_tools: ["query_attendance", "get_performance_report"]
