    context: {}

  # ── 资产/库存 ──
  - id: ts_032
    description: "查询库存"
    user_message: "笔记本电脑还有多少库存？"
    expected_tools: ["list_inventory"]
    context: {}

  - id: ts_033
    description: "资产转移"
    user_message: "把张三的笔记本电脑转给李四"
