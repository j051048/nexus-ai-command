    context: {}

  - id: ts_022
    description: "查看定时任务列表"
    user_message: "我现在有哪些定时任务？"
    expected_tools: ["list_scheduled_tasks"]
    context: {}

  - id: ts_023
    description: "删除定时任务"
    user_message: "取消那个检查客户回复的提醒"
    expected_tools: ["delete_scheduled_task"]
    context: {}

  - id: ts_024
    description: "创建每周定时任务"
    user_message: "每周一早上9点帮我生成上周的销售周报"
    expected_tools: ["create_scheduled_task"]
    context: {}

  # ── 通知场景 ──
  - id: ts_025
    description: "发送通知给个人应使用 send_notification"
    user_message: "通知小王明天上午10点开会"
    expected_tools: ["send_notification"]
    context: {}

  - id: ts_026
    description: "草拟邮件不应调用工具（应输出 EmailDraft 组件）"
    user_message: "帮我草拟一封催款邮件给华东水厂"
    expected_tools: []
    context: {}

  - id: ts_027
    description: "发布公告应使用 publish_announcement"
    user_message: "发个通知全员下周五团建"
    expected_tools: ["publish_announcement"]
    context: {}

  # ── CRM 客户管理 ──
  - id: ts_028
    description: "查询客户列表"
    user_message: "华东区的客户有哪些？"
    expected_tools: ["get_customers"]
    context: {}

  - id: ts_029
    description: "查看客户详情"
