  - id: ts_038
    description: "跨域：请假+通知"
    user_message: "帮我请明天一天假，顺便通知领导"
    expected_tools: ["create_leave_request", "send_notification"]
    context: {}

  - id: ts_039
    description: "跨域：客户跟进+阶段更新"
    user_message: "华东水厂项目已经报价了，帮我更新进度并记录跟进"
    expected_tools: ["update_customer_stage", "add_follow_up"]
    context: {}

  # ── 模糊意图（应追问） ──
  - id: ts_040
    description: "模糊意图：帮我办个事 → 应追问"
    user_message: "帮我办个事"
    expected_tools: ["ask_user"]
