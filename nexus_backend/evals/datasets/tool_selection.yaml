  # ── 工单 ──
  - id: ts_035
    description: "创建维修工单"
    user_message: "3楼会议室空调坏了，报个修"
    expected_tools: ["create_work_order"]
    context: {}

  - id: ts_036
    description: "工单统计"
    user_message: "这个月工单的处理情况怎么样？"
