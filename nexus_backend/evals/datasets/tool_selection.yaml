    context: {}

  # ── 联网搜索 ──
  - id: ts_051
    description: "需要联网搜索的实时信息"
    user_message: "最近仪器行业有什么新政策？"
    expected_tools: ["web_search"]
    context: {}

  - id: ts_052
    description: "招投标搜索"
    user_message: "帮我搜一下最近有没有光谱仪相关的招标"
    expected_tools: ["search_bidding_projects"]
    context: {}

  # ── 多工具组合场景 ──
