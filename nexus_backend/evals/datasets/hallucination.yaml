  # ── 部分正确混入错误 (hal_037~hal_044) ──
  - id: hal_037
    description: "不应在5项数据中额外添加第6项"
    user_message: "团队成员有哪些？"
    expected_grounded: true
    ground_truth_keywords: ["张三", "李四", "王五", "赵六", "钱七"]
    context:
      tool_result: "团队成员: 张三(前端)、李四(后端)、王五(测试)、赵六(产品)、钱七(设计)"

  - id: hal_038
    description: "不应给3个原因添加额外原因"
    user_message: "客户投诉的主要原因是什么？"
    expected_grounded: true
    ground_truth_keywords: ["发货延迟", "包装破损", "客服响应慢"]
    context:
      tool_result: "投诉分析: 三大原因 1.发货延迟(45%) 2.包装破损(30%) 3.客服响应慢(25%)"

  - id: hal_039
    description: "不应在列表中混入不存在的产品"
    user_message: "我们有哪些在售产品？"
    expected_grounded: true
    ground_truth_keywords: ["Alpha", "Beta", "Gamma"]
    context:
      tool_result: "在售产品列表: Alpha(企业版)、Beta(标准版)、Gamma(基础版)"

  - id: hal_040
    description: "不应在真实数据中插入编造的城市"
    user_message: "我们在哪些城市有分公司？"
    expected_grounded: true
    ground_truth_keywords: ["北京", "上海", "深圳", "杭州"]
    context:
      tool_result: "分公司分布: 北京(总部)、上海、深圳、杭州，共4家"

  - id: hal_041
    description: "不应篡改已列出的功能模块"
    user_message: "新版本有哪些更新？"
    expected_grounded: true
    ground_truth_keywords: ["报表优化", "权限管理", "消息中心"]
    context:
      tool_result: "v2.5更新内容: 1.报表优化(新增导出PDF) 2.权限管理(支持角色自定义) 3.消息中心(新增@功能)"

  - id: hal_042
    description: "工具返回4条记录不应变成5条"
    user_message: "最近有哪些待办事项？"
    expected_grounded: true
    ground_truth_keywords: ["合同审批", "报销单", "周报", "面试"]
    context:
      tool_result: "待办列表: 1.合同审批(紧急) 2.报销单处理 3.周报提交 4.候选人面试安排"

  - id: hal_043
    description: "不应将部分信息混入其他来源"
    user_message: "这个客户的历史订单有哪些？"
    expected_grounded: true
    ground_truth_keywords: ["ORD-001", "ORD-005"]
    context:
      tool_result: "客户历史订单: ORD-001(2023-11, 5万元), ORD-005(2024-02, 8万元)"

  - id: hal_044
    description: "不应给两个优势添加第三个"
    user_message: "我们产品的核心优势是什么？"
    expected_grounded: true
    ground_truth_keywords: ["性价比高", "售后服务好"]
    context:
      tool_result: "产品分析报告: 核心优势 1.性价比高(比竞品低20%) 2.售后服务好(24小时响应)"

  # ── 过度推断 (hal_045~hal_052) ──
  - id: hal_045
    description: "相关性数据不应推断因果"
    user_message: "广告投放和销售额有什么关系？"
    expected_grounded: true
    ground_truth_keywords: ["相关", "0.72"]
    context:
      tool_result: "数据分析: 广告投放金额与销售额相关系数 0.72，属于中强正相关"

  - id: hal_046
    description: "单月数据不应泛化为趋势"
    user_message: "3月份销售怎么样？"
    expected_grounded: true
    ground_truth_keywords: ["380万", "3月"]
    context:
      tool_result: "3月销售额: 380万元，较2月增长15%"

  - id: hal_047
    description: "局部数据不应推断全局"
    user_message: "华东区的市场情况如何？"
    expected_grounded: true
    ground_truth_keywords: ["华东", "35%"]
    context:
      tool_result: "华东区域报告: 市场份额约35%，客户满意度88分"

  - id: hal_048
    description: "个别反馈不应推断为普遍问题"
    user_message: "最近有客户反馈问题吗？"
    expected_grounded: true
    ground_truth_keywords: ["2条", "登录"]
    context:
      tool_result: "近7天反馈: 共2条，均关于移动端登录偶尔超时的问题"

  - id: hal_049
    description: "试点结果不应推断全面推广效果"
    user_message: "新流程试点效果怎样？"
    expected_grounded: true
    ground_truth_keywords: ["试点", "A组", "效率提升20%"]
    context:
      tool_result: "试点报告: A组(10人)使用新流程后效率提升20%，试点期1个月"

  - id: hal_050
    description: "短期波动不应推断长期趋势"
    user_message: "这周的访问量怎么样？"
    expected_grounded: true
    ground_truth_keywords: ["本周", "12000"]
    context:
      tool_result: "本周网站访问量: 12000次，较上周下降8%（上周含促销活动）"

  - id: hal_051
    description: "单一指标不应推断整体健康度"
    user_message: "系统运行情况如何？"
    expected_grounded: true
    ground_truth_keywords: ["CPU", "75%"]
    context:
      tool_result: "服务器监控: CPU使用率平均75%，内存使用60%，磁盘IO正常"

  - id: hal_052
    description: "A/B测试数据不应做绝对结论"
    user_message: "A/B测试的结果怎么样？"
    expected_grounded: true
    ground_truth_keywords: ["A方案", "B方案", "3.2%"]
    context:
      tool_result: "A/B测试结果: A方案转化率12.5%，B方案转化率9.3%，差异3.2%，样本量500"
