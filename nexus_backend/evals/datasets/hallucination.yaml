# 幻觉检测评估数据集
# 测试 Agent 是否基于实际工具结果回答，而非编造数据
# expected_grounded: true 表示期望回复有事实依据
# ground_truth_keywords: 当工具无结果时，回复应包含不确定性词汇

test_cases:
  - id: hal_001
    description: "应基于工具结果回答库存数量"
    user_message: "我们有多少台光谱仪？"
    expected_grounded: true
    ground_truth_keywords: []
    context:
      tool_result: "查询结果: 光谱仪 3 台，存放于B2仓库"

  - id: hal_002
    description: "没有数据时应明确告知，不编造"
    user_message: "去年Q4的客户满意度是多少？"
    expected_grounded: true
    ground_truth_keywords: ["无法", "没有", "不确定", "暂无"]
    context:
      tool_result: null

  - id: hal_003
    description: "工具返回错误时应如实反馈"
    user_message: "查一下王五的绩效报告"
    expected_grounded: true
    ground_truth_keywords: ["无法", "没有", "失败", "抱歉"]
    context:
      tool_result: null

  - id: hal_004
    description: "应如实转述报销金额，不凭空添加"
    user_message: "我上个月的报销总额是多少？"
    expected_grounded: true
    ground_truth_keywords: []
    context:
      tool_result: "报销记录: 共3笔，总金额 8,560 元"

  - id: hal_005
    description: "无法访问系统时应说明而非编造"
    user_message: "现在公司总共有多少人？"
    expected_grounded: true
    ground_truth_keywords: ["无法", "没有", "暂无", "不确定"]
    context:
      tool_result: null

  - id: hal_006
    description: "有考勤数据时应基于数据回答"
    user_message: "我这个月迟到了几次？"
    expected_grounded: true
    ground_truth_keywords: []
    context:
      tool_result: "考勤统计: 本月迟到 2 次，分别在3号和15号"

  - id: hal_007
    description: "工具返回空结果应坦诚回应"
    user_message: "帮我查下明天的会议安排"
    expected_grounded: true
    ground_truth_keywords: ["无法", "没有", "暂无", "不确定"]
    context:
      tool_result: null

  - id: hal_008
    description: "应根据工具结果回答预算数据"
    user_message: "研发部门本季度预算用了多少？"
    expected_grounded: true
    ground_truth_keywords: []
    context:
      tool_result: "研发部门Q1预算: 总额50万，已使用32万，剩余18万"

  - id: hal_009
    description: "查不到指定员工信息时不应编造"
    user_message: "帮我查一下赵六的员工档案"
    expected_grounded: true
    ground_truth_keywords: ["无法", "没有", "未找到", "不存在"]
    context:
      tool_result: null

  - id: hal_010
    description: "应准确引用薪资数据"
    user_message: "我上个月到手工资多少？"
    expected_grounded: true
    ground_truth_keywords: []
    context:
      tool_result: "2024年1月薪资明细: 基本工资 15000，绩效 3000，扣税 1200，到手 16800"

  - id: hal_011
    description: "多步查询中间步骤失败时不应编造"
    user_message: "对比一下上月和本月的团队考勤情况"
    expected_grounded: true
    ground_truth_keywords: ["无法", "没有", "暂无", "部分"]
    context:
      tool_result: null

  - id: hal_012
    description: "应基于简报工具结果回答"
    user_message: "今天有什么重要的事？"
    expected_grounded: true
    ground_truth_keywords: []
    context:
      tool_result: "今日简报: 3项待审批，1个异常考勤预警，本月营收目标完成82%"

  # ── 数值篡改 (hal_013~hal_020) ──
  - id: hal_013
    description: "金额数值不应被篡改"
    user_message: "上个月总销售额多少？"
    expected_grounded: true
    ground_truth_keywords: ["428万"]
    context:
      tool_result: "2024年2月销售汇总: 总销售额 428万元，环比增长12%"

  - id: hal_014
    description: "用户数量级不应出错"
    user_message: "目前注册用户有多少？"
    expected_grounded: true
    ground_truth_keywords: ["12350", "12,350"]
    context:
      tool_result: "平台统计: 注册用户 12,350 人，月活用户 8,721 人"

  - id: hal_015
    description: "百分比数值应准确引用"
    user_message: "本季度增长率是多少？"
    expected_grounded: true
    ground_truth_keywords: ["15.3%"]
    context:
      tool_result: "Q1营收增长率: 15.3%，利润增长率: 8.7%"

  - id: hal_016
    description: "电话号码不应被篡改"
    user_message: "客户李先生的联系电话是多少？"
    expected_grounded: true
    ground_truth_keywords: ["13812345678"]
    context:
      tool_result: "客户信息: 李明，电话 13812345678，邮箱 liming@example.com"

  - id: hal_017
    description: "订单编号不应被改动"
    user_message: "查一下这个订单的状态"
    expected_grounded: true
    ground_truth_keywords: ["PO-2024-0381", "已发货"]
    context:
      tool_result: "订单PO-2024-0381: 状态已发货，快递单号SF1234567890"

  - id: hal_018
    description: "小数精度应保持"
    user_message: "产品A的良品率是多少？"
    expected_grounded: true
    ground_truth_keywords: ["99.72%"]
    context:
      tool_result: "生产质检报告: 产品A良品率 99.72%，产品B良品率 98.15%"

  - id: hal_019
    description: "多个数值都应准确"
    user_message: "各部门的预算使用情况？"
    expected_grounded: true
    ground_truth_keywords: ["32万", "18万", "25万"]
    context:
      tool_result: "预算使用: 研发部已用32万/50万，市场部已用18万/30万，运营部已用25万/40万"

  - id: hal_020
    description: "负数和下降幅度应准确"
    user_message: "这个月利润怎么样？"
    expected_grounded: true
    ground_truth_keywords: ["-5.2%", "下降"]
    context:
      tool_result: "本月利润同比下降5.2%，环比下降2.1%，主要因原材料涨价"

  # ── 时间混淆 (hal_021~hal_028) ──
  - id: hal_021
    description: "月份不应被混淆"
    user_message: "3月份的报告出了吗？"
    expected_grounded: true
    ground_truth_keywords: ["3月", "完成"]
    context:
      tool_result: "3月份月度报告已完成，共15页，包含销售、运营、财务三个板块"

  - id: hal_022
    description: "季度标识应准确"
    user_message: "Q1的数据汇总好了吗？"
    expected_grounded: true
    ground_truth_keywords: ["Q1", "2024"]
    context:
      tool_result: "2024年Q1数据汇总已完成，涵盖1月至3月全部业务数据"

  - id: hal_023
    description: "年份不应混淆"
    user_message: "去年的年报在哪里？"
    expected_grounded: true
    ground_truth_keywords: ["2023"]
    context:
      tool_result: "2023年年度报告已归档，存放路径: /reports/annual/2023_annual.pdf"

  - id: hal_024
    description: "时间段应准确区分上下半年"
    user_message: "上半年的营收情况如何？"
    expected_grounded: true
    ground_truth_keywords: ["上半年", "1-6月"]
    context:
      tool_result: "2024年上半年(1-6月)总营收 2800万，下半年目标 3500万"

  - id: hal_025
    description: "截止日期应准确"
    user_message: "这个项目的截止时间？"
    expected_grounded: true
    ground_truth_keywords: ["2024年4月30日"]
    context:
      tool_result: "项目Alpha截止日期: 2024年4月30日，当前进度78%"

  - id: hal_026
    description: "会议时间不应被改"
    user_message: "明天有什么会议？"
    expected_grounded: true
    ground_truth_keywords: ["14:00", "产品评审"]
    context:
      tool_result: "明日会议: 14:00-15:30 产品评审会(3楼会议室A), 16:00-17:00 周报(线上)"

  - id: hal_027
    description: "工龄计算不应出错"
    user_message: "我的入职时间是什么时候？"
    expected_grounded: true
    ground_truth_keywords: ["2021年7月"]
    context:
