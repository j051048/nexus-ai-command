    user_message: "这个供应商合同什么时候到期？"
    expected_grounded: true
    ground_truth_keywords: ["2025年6月", "续签"]
    context:
      tool_result: "供应商A合同: 2023年6月签订，有效期2年，2025年6月30日到期，需提前3个月启动续签"

