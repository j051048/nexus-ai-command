      complexity: "complex"
      tool_count: 3
    max_latency_ms: 15000
    max_cost_usd: 0.15

  - id: lc_014
    description: "跨模块数据聚合应在15秒内完成"
    user_message: "对比上个月和这个月的线索转化漏斗，找出转化率下降最多的阶段"
    context:
      complexity: "complex"
      tool_count: 2
    max_latency_ms: 15000
    max_cost_usd: 0.15

  - id: lc_015
    description: "复杂报表生成应在15秒内完成"
    user_message: "生成一份包含销售额、回款率、客户满意度的月度综合报表"
    context:
      complexity: "complex"
      tool_count: 4
    max_latency_ms: 15000
    max_cost_usd: 0.15

  # ── CRITICAL: 关键/高复杂度 (max_latency=30000ms, max_cost=$0.30, tool_count=3-6) ──
  - id: lc_016
    description: "全量数据分析+决策建议应在30秒内完成"
    user_message: "分析过去半年所有销售数据，找出业绩下滑的根本原因，并给出具体的改进方案和人员调整建议"
    context:
      complexity: "critical"
      tool_count: 5
    max_latency_ms: 30000
    max_cost_usd: 0.30

  - id: lc_017
    description: "多步骤自动化流程应在30秒内完成"
    user_message: "帮我执行月末结算流程：核对所有未回款订单、发送催款提醒、更新财务台账、生成逾期报告"
    context:
      complexity: "critical"
      tool_count: 6
    max_latency_ms: 30000
    max_cost_usd: 0.30

  - id: lc_018
    description: "深度知识推理+多源整合应在30秒内完成"
    user_message: "结合CRM数据、知识库文档和历史沟通记录，为即将拜访的重点客户准备一份完整的客户画像和谈判策略"
    context:
      complexity: "critical"
      tool_count: 5
    max_latency_ms: 30000
    max_cost_usd: 0.30

  - id: lc_019
    description: "跨系统数据同步+校验应在30秒内完成"
    user_message: "对比ERP和CRM中的客户数据，找出不一致的记录并生成数据清洗方案"
    context:
      complexity: "critical"
      tool_count: 4
    max_latency_ms: 30000
    max_cost_usd: 0.30

  - id: lc_020
    description: "端到端项目规划应在30秒内完成"
    user_message: "根据新签约的大客户合同，自动拆解项目里程碑、创建WBS任务树、分配资源并设置各阶段的预警规则"
    context:
      complexity: "critical"
      tool_count: 6
    max_latency_ms: 30000
    max_cost_usd: 0.30
