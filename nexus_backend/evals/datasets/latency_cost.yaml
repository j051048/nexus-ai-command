      complexity: "complex"
      tool_count: 3
    max_latency_ms: 15000
    max_cost_usd: 0.15

  - id: lc_012
    description: "批量创建任务应在15秒内完成"
    user_message: "根据这个项目方案创建主任务和5个子任务，分别分配给不同的团队成员"
    context:
      complexity: "complex"
      tool_count: 4
    max_latency_ms: 15000
    max_cost_usd: 0.15

  - id: lc_013
    description: "知识库检索+总结应在15秒内完成"
    user_message: "从知识库中找出关于客户投诉处理的流程，并结合最近的投诉记录给我一个改进建议"
