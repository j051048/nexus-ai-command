# 延迟/成本评估数据集
# 验证不同复杂度查询的延迟和成本是否在可接受范围内

test_cases:
  # ── SIMPLE: 简单查询 (max_latency=3000ms, max_cost=$0.01, tool_count=0-1) ──
  - id: lc_001
    description: "简单闲聊应在3秒内完成"
    user_message: "今天天气怎么样？"
    context:
      complexity: "simple"
      tool_count: 0
    max_latency_ms: 3000
    max_cost_usd: 0.01

  - id: lc_002
    description: "简单问候应在3秒内完成"
    user_message: "你好，请问你能帮我做什么？"
    context:
      complexity: "simple"
      tool_count: 0
    max_latency_ms: 3000
    max_cost_usd: 0.01

  - id: lc_003
    description: "简单确认操作应在3秒内完成"
    user_message: "好的，就这样吧"
    context:
      complexity: "simple"
      tool_count: 0
    max_latency_ms: 3000
    max_cost_usd: 0.01

  - id: lc_004
    description: "单工具简单查询应在3秒内完成"
    user_message: "查一下我今天有几条待办事项"
    context:
      complexity: "simple"
      tool_count: 1
    max_latency_ms: 3000
    max_cost_usd: 0.01

  - id: lc_005
    description: "简单数据读取应在3秒内完成"
    user_message: "帮我看看最新的一条销售线索"
    context:
      complexity: "simple"
      tool_count: 1
    max_latency_ms: 3000
    max_cost_usd: 0.01

  # ── MODERATE: 中等复杂度 (max_latency=8000ms, max_cost=$0.05, tool_count=1-2) ──
  - id: lc_006
    description: "带过滤条件的查询应在8秒内完成"
    user_message: "帮我查一下上周新增的所有客户线索，按优先级排序"
    context:
      complexity: "moderate"
      tool_count: 1
    max_latency_ms: 8000
    max_cost_usd: 0.05

  - id: lc_007
    description: "创建单条记录应在8秒内完成"
    user_message: "帮我创建一条销售线索，公司名是华为科技，联系人张三，电话13800138000"
    context:
      complexity: "moderate"
      tool_count: 2
    max_latency_ms: 8000
    max_cost_usd: 0.05

  - id: lc_008
    description: "简单统计查询应在8秒内完成"
    user_message: "这个月我们团队总共完成了多少笔订单？"
    context:
      complexity: "moderate"
      tool_count: 1
    max_latency_ms: 8000
    max_cost_usd: 0.05

  - id: lc_009
    description: "查询并更新记录应在8秒内完成"
    user_message: "把编号SL-2024-0315的线索状态改为已跟进"
    context:
      complexity: "moderate"
      tool_count: 2
    max_latency_ms: 8000
    max_cost_usd: 0.05

  - id: lc_010
    description: "带条件的列表查询应在8秒内完成"
    user_message: "列出所有优先级为高且还未分配的任务"
    context:
      complexity: "moderate"
      tool_count: 1
    max_latency_ms: 8000
    max_cost_usd: 0.05

  # ── COMPLEX: 复杂查询 (max_latency=15000ms, max_cost=$0.15, tool_count=2-4) ──
  - id: lc_011
    description: "多表关联分析应在15秒内完成"
    user_message: "帮我分析本季度各销售人员的业绩排名，包括成交金额和客户转化率"
